<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Art Museum - Gallery</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <main>
    <h1>Gallery</h1>
    <div id="gallery-main">
      <!-- ואן גוך -->
      <article>
        <h2 id="gogh-gallery">Vincent van Gogh</h2>
        <div class="gallery">
          <figure class="thumbnail">
            <a href="#popup-work2"> <img id="gogh-work2" class="gogh-work" src="img/artwork2.jpg"></a>
            <figcaption>Starry Night</figcaption>
          </figure>
          <figure class="thumbnail">
            <a href="#popup-work1"><img id="gogh-work1" class="gogh-work" src="img/artwork1.jpg"></a>
            <figcaption>Starry Night</figcaption>
          </figure>
          <figure class="thumbnail">
            <a href="#popup-work3"> <img id="gogh-work3" class="gogh-work" src="img/artwork3.jpg"></a>
            <figcaption>Starry Night</figcaption>
          </figure>
        </div>
      </article>
      <!-- לאורנרדו דה וינצ'י -->
      <article>
        <h2 id="vinci-gallery">Leonardo da Vinci</h2>
        <div class="gallery">
          <figure class="thumbnail">
            <a href="#popup-work4"> <img id="vinci-work1" class="vinci-work" src="img/artwork7.jpg"></a>
            <figcaption>Starry Night</figcaption>
          </figure>
          <figure class="thumbnail">
            <a href="#popup-work5"> <img id="vinci-work2" class="vinci-work" src="img/artwork8.jpg"></a>
            <figcaption>Starry Night</figcaption>
          </figure>
          <figure class="thumbnail">
            <a href="#popup-work6"> <img id="vinci-work3" class="vinci-work" src="img/artwork9.jpg"></a>
            <figcaption>Starry Night</figcaption>
          </figure>
        </div>
      </article>
      <!-- פאבלו פיקאסו -->
      <article>
        <h2 id="picasso-gallery">Pablo Picasso</h2>
        <div class="gallery">
          <figure class="thumbnail">
            <a href="#popup-work7"> <img id="picasso-work1" class="picasso-work" src="img/artwork4.jpg"></a>
            <figcaption>Starry Night</figcaption>
          </figure>
          <figure class="thumbnail">
            <a href="#popup-work8"> <img id="picasso-work2" class="picasso-work" src="img/artwork5.jpg"></a>
            <figcaption>Starry Night</figcaption>
          </figure>
          <figure class="thumbnail">
            <a href="#popup-work9"> <img id="picasso-work3" class="picasso-work" src="img/artwork6.jpg"></a>
              <figcaption>Starry Night</figcaption>
          </figure>
        </div>
      </article>
    </div>
  </main>
  <section>
    <!-- ואן גוך -->
    <div id="popup-work1" class="work-popup">
      <a href="#gogh-work1"><input type="button" value="BACK"></a><br>
      <img class="img-popup" src="img/artwork1.jpg">
    </div>
    <div id="popup-work2" class="work-popup">
      <a href="#gogh-work2"><input type="button" value="BACK"></a><br>
      <img class="img-popup" src="img/artwork2.jpg">
    </div>
    <div id="popup-work3" class="work-popup">
      <a href="#gogh-work3"><input type="button" value="BACK"></a><br>
      <img class="img-popup" src="img/artwork3.jpg">
    </div>
    <!-- לאנרדו דה וינצ'י -->
    <div id="popup-work4" class="work-popup">
      <a href="#vinci-work1"><input type="button" value="BACK"></a><br>
      <img class="img-popup" src="img/artwork7.jpg">
    </div>
    <div id="popup-work5" class="work-popup">
      <a href="#vinci-work2"><input type="button" value="BACK"></a><br>
      <img class="img-popup" src="img/artwork8.jpg">
    </div>
    <div id="popup-work6" class="work-popup">
      <a href="#vinci-work3"><input type="button" value="BACK"></a><br>
      <img class="img-popup" src="img/artwork9.jpg">
    </div>
    <!-- פאבלו פיקאסו -->
    <div id="popup-work7" class="work-popup">
      <a href="#picasso-work1"><input type="button" value="BACK"></a><br>
      <img class="img-popup" src="img/artwork4.jpg">
    </div>
    <div id="popup-work8" class="work-popup">
      <a href="#picasso-work2"><input type="button" value="BACK"></a><br>
      <img class="img-popup" src="img/artwork5.jpg">
    </div>
    <div id="popup-work9" class="work-popup">
      <a href="#picasso-work3"><input type="button" value="BACK"></a><br>
      <img class="img-popup" src="img/artwork6.jpg">
    </div>
  </section>
</body>

</html>
